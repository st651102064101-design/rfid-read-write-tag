plugins { id 'com.android.application' }
def local = new Properties()
if(rootProject.file('local.properties').exists())rootProject.file('local.properties').withInputStream { local.load(it) }
def zebraDir = System.getenv('ZEBRA_RFID_SDK_DIR') ?: local.getProperty('zebra.sdk.dir')
if(!zebraDir || !file(zebraDir).exists())throw new GradleException('Set ZEBRA_RFID_SDK_DIR to the licensed Zebra RFID SDK 2.0.4.177 split AAR folder')
android {
 namespace 'com.kriangkrai.rfid'
 compileSdk 35
 defaultConfig { applicationId 'com.kriangkrai.rfid.mc3390r'; minSdk 27; targetSdk 28; versionCode 9; versionName '1.0.8' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 buildTypes { release { minifyEnabled false } }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation fileTree(dir:zebraDir,include:['*.aar'])
 implementation 'com.google.android.material:material:1.12.0'
 testImplementation 'junit:junit:4.13.2'
}
